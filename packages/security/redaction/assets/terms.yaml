# ============================================================================
#  华润三九众益 · dsh 会话脱敏词表（黑名单档 R1）
# ============================================================================
#  维护：保密办          版本：1.1.0          生效：2026-10-22
#  分发：内网 gitea `ITPublic/dsh-redaction-terms`，客户端启动拉一次 + 每 5 分钟轮询
#  设计：`redaction-tool-design.md` §3
#
#  ── 收录范围（m27158 收窄）──────────────────────────────────────────────
#  只保留五类：工艺指标（craft / craft-metric）、处方（recipe）、产品（product）、
#  持有人公司（holder，别名组 公司N-M）、财务（finance）。
#  编号、设备型号、偏差、研发、人力、人员与联系方式、非持有人公司词全部退出：
#  这些词单独出现不构成泄密，拦住它们只会拖累模型。
#  工艺与财务只脱「名称」，紧邻的数值与单位一律原样输出，让模型还能算。
#
#  ── 三条硬规则 ──────────────────────────────────────────────────────────
#  1. 拦「名称」，不拦「话题词」，也尽量不拦「数值」。
#        ✗ 工艺、财务、偏差        ← 部门日常用语，拦了模型基本没法工作
#        ✓ 热封温度、红霉素肠溶胶囊、单价
#      数值（165℃、12.5元、25.5kg）默认留在正文，模型要靠它算；只有 recipe
#      里「处方量 + 单位」这种整体即泄密的组合才连数值一起换。
#      判据：这个字符串单独给外人看，是否足以复现、定位或推断出具体内容？
#
#  2. 中文两字词误伤率极高：放进 terms 的词必须能独立指认对象。
#        「热封温度」「混合时间」「单价」合格；「温度」「时间」不合格。
#        需要上下文时写正则，例：`(?:占比|比例)[:：]?\s*\d+(?:\.\d+)?\s*%`。
#
#  3. patterns 用 JS 正则子集（RE2 兼容）：不要 lookbehind、不要反向引用。
#     中英文冒号都写 `[:：]`，单位写 `(?:元|万元)`。
#
#  ── `# ←补` 标记 ──────────────────────────────────────────────────────
#  这些条目需要按内部实际情况补充（具体代号码、部门编号、产品名等）。
# ============================================================================

version: 1
revision: '2026-10-22'

categories:
  # ── 工艺：只脱术语本身，数值留给模型 ─────────────────────────────────
  #  口径（m27158）：`关键工艺参数 165℃` 只脱「关键工艺参数」，「165℃」原样输出。
  #  原先的两条 pattern 会把冒号后面的整段（含数值）吃掉，模型就拿不到可算的数。
  - id: craft
    label: 工艺
    terms:
      - 工艺验证
      - 处方比例
      - 处方组成
      - 关键工艺参数
      - 合成路线
      - 结晶工艺
      - 精制工艺
      - 中间体名称
      # ←补 产品代号、中间体代号、专用工序名（如某个内部工序编号）
    patterns: []

  # ── 工艺指标（第4项）：只脱指标名，数值与单位原样保留 ─────────────────
  #  口径（m27158）：`热封温度 165℃` 只脱「热封温度」，「165℃」要留给模型做
  #  区间比对与热量核算。指标名 + 数值 + 单位整段替换会连数值一起藏起来。
  - id: craft-metric
    label: 工艺
    terms:
      - 热封温度
      - 进风温度
      - 出风温度
      - 循环风温度
      - 预热温度
      - 干燥温度
      - 物料温度
      - 锅温
      - 床温
      - 喷枪温度
      - 真空度
      - 搅拌速度
      - 搅拌转速
      - 进风量
      - 排风量
      - 风量
      - 压差
      - 喷液速率
      - 喷液量
      - 主机转速
      - 包衣增重
      - 供液量
      - 片重差异
      - 片重
      - 硬度
      - 脆碎度
      - 崩解时限
      - 溶出度
      - 水分限度
      - 水分
      - 含量均匀度
      - 堆密度
      - 振实密度
      - 收膏率
      - 出膏率
      - 收率
      - 得率
      - 混合时间
      - 干燥时间
      - 制粒时间
      - 包衣时间
      - 过筛目数
      - 筛网目数
      - 粒度分布
      - 粒径
      - 增重
    patterns: []

  # ── 处方与投料量（Z 规程清单 A 档 1）：处方组成与投料量整体脱敏 ───────────
  #  说明书外的东西：各组分 mg/片、占比、外加比例、投料量折算。
  #  只拦带单位的量，不拦「处方」这个词本身（那是话题词，拦了正文没法读）。
  - id: recipe
    label: 处方
    terms:
      - 处方组成
      - 处方比例
      - 投料量
      - 理论投料量
      - 实际投料量
      - 外加比例
      - 内加比例
      - 总混比例
    patterns:
      # 每片/每粒/每袋的规格量：2.5mg/片、0.125g/粒。
      - '\d+(?:\.\d+)?\s*(?:mg|g|μg|ug|ml|mL)\s*/\s*(?:片|粒|袋|支|瓶|丸)'
      # 百分比占比：占比 12.5%、外加 3%。
      - '(?:占比|比例|含量)[:：]?\s*\d+(?:\.\d+)?\s*%'
      # 投料量带单位：投料量 25.5kg、投料 1200 片。
      - '(?:投料量|投料|处方量|批量)[:：]?\s*\d+(?:\.\d+)?(?:\s*[~～〜\-–—至到]\s*\d+(?:\.\d+)?)?\s*(?:kg|g|mg|万片|片|粒|袋|L|ml|mL)'


  # ── 财务：只脱金额口径词，数值原样保留 ────────────────────────────────
  #  口径（m27158）：`单价: 12.5元` 只脱「单价」，「12.5元」留给模型算总额。
  #  带单位的那条正则、以及合同号 / 纳税人识别号 / 银行账号条目随本次收窄退出。
  - id: finance
    label: 财务指标
    terms:
      - 单价
      - 报价
      - 金额
      - 成本
      - 毛利
      - 售价
      - 费用
    patterns: []

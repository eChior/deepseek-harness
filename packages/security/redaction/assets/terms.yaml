  # ── 设备型号（Z 规程清单 A 档 6）：型号脱敏，设备名称留着 ────────────────
  #  口径：「高效包衣机」「压片机」是通用名词，不脱；「GZP-37B」「LHSG-300」
  #  这种型号唯一性高，能定位厂家和产线，要脱。
  - id: equipment
    label: 设备
    terms: []
    patterns:
      # 带连字符的型号：GZP-37B、LHSG-300、ZP-33。连字符是必需的——它把
      # 型号和「R2026」这类普通缩写、批次号区分开；更长的编号由 identifier
      # 类先命中（同一处重叠时 identifier 优先）。
      - '\b[A-Z]{2,6}-\d{2,5}[A-Z]{0,3}\b'
      # 明确写了「型号/机型/设备」的场合，连字符可有可无。
      - '(?:设备型号|型号|机型|设备)[:：]\s*[A-Za-z]{1,6}-?\d{1,6}[A-Za-z]{0,3}'
      # 纯数字产能描述：产能 30 万片/小时、转速 12 rpm。单位降序，理由同上。
      - '(?:产能|生产能力|装量|转速)[:：]?\s*\d+(?:\.\d+)?(?:\s*[~～〜]\s*\d+(?:\.\d+)?)?\s*(?:万片/小时|片/小时|次/小时|万片|片|粒|袋|kg|L|rpm|r/min|转/分|次/分|/小时|/分)'

  # ── 偏差：质量事件的主体描述与处置动作 ────────────────────────────────
  - id: deviation
    label: 偏差
    terms:
      - 偏差调查
      - 偏差报告
      - 偏差描述
      - 根本原因
      - 纠正预防措施
      - 变更控制
      - 稳定性考察
      - 检验结果超标
      - 检验结果超趋势
    patterns:
      - '偏差(?:编号|单号)[:：]?\s*[A-Za-z0-9\-]{3,32}'
      - '偏差(?:分级|级别|类别|数量)[:：]?\s*[A-Za-z0-9\u4e00-\u9fa5]{1,8}'
      - '(?:决定|要求|需要)(?:重新|返工|报废|销毁|退货|召回)'
      - '不合格(?:品|批|项)'

  # ── 研发：项目代号、临床阶段、注册与专利 ──────────────────────────────
  - id: research
    label: 研发
    terms:
      - 化合物代号
      - 候选化合物
      - 临床方案
      - 参比制剂
      - 一致性评价
      - 生物等效性
      - 注册申报
      - 专利布局
      # ←补 项目代号（如 `项目 SZ-2024-01`）、化合物内部编号
    patterns:
      - '(?:项目|课题)(?:代号|编号)?[:：]?\s*[A-Za-z0-9\u4e00-\u9fa5\-]{2,}'
      - '(?:I{1,3}|IV|[1-4])\s*期临床'
      - 'ZL\d{8,}'
      - 'CN\d{9,}'

  # ── 财务：金额、报价、成本、合同与账户 ────────────────────────────────
  - id: finance
    label: 财务
    terms:
      - 成本价
      - 采购单价
      - 供应商报价
      - 中标价
      - 毛利率
      - 预算明细
      - 回款
    patterns:
      - '(?:单价|报价|金额|成本|毛利|售价|费用)[:：]?\s*[\d,]+(?:\.\d+)?\s*(?:元|万元|亿|美元|USD|RMB)'
      - '\d+(?:\.\d+)?\s*万元'
      - '(?:合同|订单|协议)(?:号|编号)[:：]?\s*[A-Za-z0-9\-]{4,}'
      - '纳税人识别号[:：]?\s*[A-Z0-9]{15,20}'
      - '(?:开户行|银行账号|账号)[:：]?\s*[\d\s\-]{8,}'

  # ── 人力：薪酬、绩效、职级 ───────────────────────────────────────────
  - id: hr
    label: 人力
    terms:
      - 薪酬
      - 月薪
      - 年薪
      - 调薪
      - 年终奖
      - 绩效等级
      - 绩效评分
      - 人员编制
      - 岗位职级
      - 人员调整
    patterns:
      - '(?:薪酬|月薪|年薪|工资|奖金|补贴)[:：]?\s*[\d,]+(?:\.\d+)?\s*(?:元|万|k|K)?'
      - '绩效(?:等级|评分|结果)[:：]?\s*[A-Za-z0-9\u4e00-\u9fa5]{1,6}'
      - '(?:职级|职等)[:：]?\s*[A-Za-z0-9\u4e00-\u9fa5]{1,6}'

  # ── 通用 PII（R2 也会跑，这里是兜底）──────────────────────────────────
  - id: person
    label: 人员
    terms:
      # ←补 需重点保护的人员姓名（高管、关键岗位）。
      #     不建议把普通员工姓名全列进来：几千个名字维护不动、误伤高，
      #     交给 R3 的本地 NER 更实际。
    patterns:
      - '\d{17}[\dXx]'
      - '(?:身份证|证件)号[:：]?\s*[A-Za-z0-9]{6,20}'

  - id: contact
    label: 联系
    terms: []
    patterns:
      - '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}'
      - '[a-z0-9-]+\.(?:crc\.com\.cn|internal|local)(?::\d+)?'
      - 'https?://(?:[a-z0-9-]+\.)*rwork\.crc\.com\.cn\S*'

  # ── 公司 / 品牌（本企业及关联方）─────────────────────────────────────────
  - id: company
    label: 公司
    terms:
      # ←补 关联方、子公司、对外合作方全称。
      #     单独出现的「华润」「三九」「众益」也算实体，不按话题词处理：
      #     正文里出现它们时，指的几乎必然是集团本身。
      - 华润三九众益
      - 华润三九
      - 华润医药
      - 华润集团
      - 华润
      - 三九医药
      - 三九集团
      - 三九
      - 众益制药
      - 众益药业
      - 浙江众益
      - 众益
    patterns:
      - '(?:CR|China Resources)\s*[Ss]anjiu'
      - '[Ss]anjiu'
      - '999\s*(?:医药|药业|感冒灵|皮炎平|健康)'
      - '[Zz]hongyi'
      - '[\u4e00-\u9fa5]{2,10}(?:股份有限公司|有限责任公司|有限公司)'

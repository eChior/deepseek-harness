# ============================================================================
#  华润三九众益 · dsh 会话脱敏词表（黑名单档 R1）
# ============================================================================
#  维护：保密办          版本：1.0.1          生效：2026-10-16
#  分发：内网 gitea `ITPublic/dsh-redaction-terms`，客户端启动拉一次 + 每 5 分钟轮询
#  设计：`redaction-tool-design.md` §3
#
#  ── 三条硬规则 ──────────────────────────────────────────────────────────
#  1. 只拦「标识符」与「具体数据」，不拦「话题词」。
#        ✗ 工艺、偏差、研发、财务    ← 部门日常用语，拦了模型基本没法工作
#        ✓ 工艺规程、收率: 87.3%、SOP-ST-AD-001-R6-01、成本价: 12.5元
#      判据：这个字符串单独给外人看，是否足以复现或推断出具体内容？
#
#  2. 中文两字词误伤率极高，优先三字以上短语，或带上下文的正则。
#        要拦"偏差编号 DEV-2026-014"，就写 `偏差编号[:：]` 或 `DEV-\d{4}-\d{3}`，
#        而不是把"偏差"本身当词条。
#
#  3. patterns 用 JS 正则子集（RE2 兼容）：不要 lookbehind、不要反向引用。
#     中英文冒号都写 `[:：]`，单位写 `(?:元|万元)`。
#
#  ── `# ←补` 标记 ──────────────────────────────────────────────────────
#  这些条目需要按内部实际情况补充（具体代号码、部门编号、产品名等）。
# ============================================================================

version: 1
revision: '2026-10-16'

categories:
  # ── 标识类：编号、单号。信息量最高、误伤最低，优先保证覆盖 ──────────────
  - id: identifier
    label: 编号
    terms: []
    patterns:
      - '(?:SOP|STP|SMP|REC)-[A-Z]{2,4}(?:-[A-Z]{2,4})*-\d{2,4}(?:-R\d+)?(?:-\d{2})?'
      # 通用「两段以上字母 + 数字」的编号，覆盖上面清单没列到的前缀（如 CAM-SW-001）。
      # 单段字母加数字（UTF-8）与一位字母段（API-2）都不匹配，避免误伤普通缩写。
      - '\b[A-Z]{2,5}(?:-[A-Z]{2,5})+-\d{2,4}(?:-R\d+)?(?:-\d{2})?\b'
      - '(?:DEV|CAPA|OOS|OOT|CC|CR|NC|PV)[- ]?\d{3,}(?:-\d{1,4})?'
      - '(?:批号|物料(?:号|代码)|产品(?:号|代码)|货号)[:：]?\s*[A-Z0-9][A-Z0-9\-]{3,}'
      - 'LOT[- ]?[:：]?\s*[A-Z0-9]{4,}'
      - '工号[:：]?\s*[A-Za-z0-9\-]{3,}'

  # ── 工艺：只拦"带数值的关键参数"与配方本体，不拦参数名 ─────────────────
  - id: craft
    label: 工艺
    terms:
      - 工艺规程
      - 工艺验证
      - 处方比例
      - 处方组成
      - 关键工艺参数
      - 合成路线
      - 结晶工艺
      - 精制工艺
      - 收率
      - 中间体名称
      # ←补 产品代号、中间体代号、专用工序名（如某个内部工序编号）
    patterns:
      - '收率[:：]?\s*\d+(?:\.\d+)?\s*%'
      - '(?:温度|压力|转速|pH|搅拌|流速)[:：]?\s*\d+(?:\.\d+)?\s*(?:℃|C|kPa|KPa|MPa|bar|rpm|min|h)?'
      - '(?:处方|配方|投料)[:：]\s*[^\s，。;；]{2,}'
      - '中间体[:：]?\s*[A-Za-z0-9\u4e00-\u9fa5\-]{2,}'

  # ── 偏差：质量事件的主体描述与处置动作 ────────────────────────────────
  - id: deviation
    label: 偏差
    terms:
      - 偏差调查
      - 偏差报告
      - 偏差描述
      - 根本原因
      - 纠正预防措施
      - 变更控制
      - 稳定性考察
      - 检验结果超标
      - 检验结果超趋势
    patterns:
      - '偏差(?:编号|单号)[:：]?\s*[A-Za-z0-9\-]{3,32}'
      - '偏差(?:分级|级别|类别|数量)[:：]?\s*[A-Za-z0-9\u4e00-\u9fa5]{1,8}'
      - '(?:决定|要求|需要)(?:重新|返工|报废|销毁|退货|召回)'
      - '不合格(?:品|批|项)'

  # ── 研发：项目代号、临床阶段、注册与专利 ──────────────────────────────
  - id: research
    label: 研发
    terms:
      - 化合物代号
      - 候选化合物
      - 临床方案
      - 参比制剂
      - 一致性评价
      - 生物等效性
      - 注册申报
      - 专利布局
      # ←补 项目代号（如 `项目 SZ-2024-01`）、化合物内部编号
    patterns:
      - '(?:项目|课题)(?:代号|编号)?[:：]?\s*[A-Za-z0-9\u4e00-\u9fa5\-]{2,}'
      - '(?:I{1,3}|IV|[1-4])\s*期临床'
      - 'ZL\d{8,}'
      - 'CN\d{9,}'

  # ── 财务：金额、报价、成本、合同与账户 ────────────────────────────────
  - id: finance
    label: 财务
    terms:
      - 成本价
      - 采购单价
      - 供应商报价
      - 中标价
      - 毛利率
      - 预算明细
      - 回款
    patterns:
      - '(?:单价|报价|金额|成本|毛利|售价|费用)[:：]?\s*[\d,]+(?:\.\d+)?\s*(?:元|万元|亿|美元|USD|RMB)'
      - '\d+(?:\.\d+)?\s*万元'
      - '(?:合同|订单|协议)(?:号|编号)[:：]?\s*[A-Za-z0-9\-]{4,}'
      - '纳税人识别号[:：]?\s*[A-Z0-9]{15,20}'
      - '(?:开户行|银行账号|账号)[:：]?\s*[\d\s\-]{8,}'

  # ── 人力：薪酬、绩效、职级 ───────────────────────────────────────────
  - id: hr
    label: 人力
    terms:
      - 薪酬
      - 月薪
      - 年薪
      - 调薪
      - 年终奖
      - 绩效等级
      - 绩效评分
      - 人员编制
      - 岗位职级
      - 人员调整
    patterns:
      - '(?:薪酬|月薪|年薪|工资|奖金|补贴)[:：]?\s*[\d,]+(?:\.\d+)?\s*(?:元|万|k|K)?'
      - '绩效(?:等级|评分|结果)[:：]?\s*[A-Za-z0-9\u4e00-\u9fa5]{1,6}'
      - '(?:职级|职等)[:：]?\s*[A-Za-z0-9\u4e00-\u9fa5]{1,6}'

  # ── 通用 PII（R2 也会跑，这里是兜底）──────────────────────────────────
  - id: person
    label: 人员
    terms:
      # ←补 需重点保护的人员姓名（高管、关键岗位）。
      #     不建议把普通员工姓名全列进来：几千个名字维护不动、误伤高，
      #     交给 R3 的本地 NER 更实际。
    patterns:
      - '\d{17}[\dXx]'
      - '1[3-9]\d{9}'
      - '(?:身份证|证件)号[:：]?\s*[A-Za-z0-9]{6,20}'

  - id: contact
    label: 联系
    terms: []
    patterns:
      - '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}'
      - '(?:10|172\.(?:16|17|18|19|2\d|3[01]))\.\d{1,3}\.\d{1,3}(?:\.\d{1,3})?'
      - '[a-z0-9-]+\.(?:crc\.com\.cn|internal|local)(?::\d+)?'
      - 'https?://(?:[a-z0-9-]+\.)*rwork\.crc\.com\.cn\S*'

  # ── 公司 / 品牌（本企业及关联方）─────────────────────────────────────────
  - id: company
    label: 公司
    terms:
      # ←补 关联方、子公司、对外合作方全称。
      #     单独出现的「华润」「三九」「众益」也算实体，不按话题词处理：
      #     正文里出现它们时，指的几乎必然是集团本身。
      - 华润三九众益
      - 华润三九
      - 华润医药
      - 华润集团
      - 华润
      - 三九医药
      - 三九集团
      - 三九
      - 众益制药
      - 众益药业
      - 浙江众益
      - 众益
    patterns:
      - '(?:CR|China Resources)\s*[Ss]anjiu'
      - '[Ss]anjiu'
      - '999\s*(?:医药|药业|感冒灵|皮炎平|健康)'
      - '[Zz]hongyi'
      - '[\u4e00-\u9fa5]{2,10}(?:股份有限公司|有限责任公司|有限公司)'

# ============================================================================
#  华润三九众益 · dsh 会话脱敏词表（黑名单档 R1）
# ============================================================================
#  维护：保密办          版本：1.0.1          生效：2026-10-16
#  分发：内网 gitea `ITPublic/dsh-redaction-terms`，客户端启动拉一次 + 每 5 分钟轮询
#  设计：`redaction-tool-design.md` §3
#
#  ── 三条硬规则 ──────────────────────────────────────────────────────────
#  1. 只拦「标识符」与「具体数据」，不拦「话题词」。
#        ✗ 工艺、偏差、研发、财务    ← 部门日常用语，拦了模型基本没法工作
#        ✓ 工艺验证、收率: 87.3%、SOP-ST-AD-001-R6-01、成本价: 12.5元
#      判据：这个字符串单独给外人看，是否足以复现或推断出具体内容？
#
#  2. 中文两字词误伤率极高，优先三字以上短语，或带上下文的正则。
#        要拦"偏差编号 DEV-2026-014"，就写 `偏差编号[:：]` 或 `DEV-\d{4}-\d{3}`，
#        而不是把"偏差"本身当词条。
#
#  3. patterns 用 JS 正则子集（RE2 兼容）：不要 lookbehind、不要反向引用。
#     中英文冒号都写 `[:：]`，单位写 `(?:元|万元)`。
#
#  ── `# ←补` 标记 ──────────────────────────────────────────────────────
#  这些条目需要按内部实际情况补充（具体代号码、部门编号、产品名等）。
# ============================================================================

version: 1
revision: '2026-10-23'

categories:
  # ── 标识类：编号、单号。信息量最高、误伤最低，优先保证覆盖 ──────────────
  - id: identifier
    label: 编号
    terms: []
    patterns:
      - '(?:SOP|STP|SMP|REC)-[A-Z]{2,4}(?:-[A-Z]{2,4})*-\d{2,4}(?:-R\d+)?(?:-\d{2})?'
      # 内部文件编号：TP-SW2-064-01、TP-SW2-064-R3（Z 规程清单 A 档 4）。
      # 中间段允许字母后接数字（SW2），这是车间/工序代码的常见写法。
      - '\b[A-Z]{2,4}-[A-Z]{2,4}\d{1,3}-\d{2,4}(?:-\d{2})?(?:-R\d+)?\b'
      # 通用「两段以上字母 + 数字」的编号，覆盖上面清单没列到的前缀（如 CAM-SW-001）。
      # 单段字母加数字（UTF-8）与一位字母段（API-2）都不匹配，避免误伤普通缩写。
      - '\b[A-Z]{2,5}(?:-[A-Z]{2,5})+-\d{2,4}(?:-R\d+)?(?:-\d{2})?\b'
      - '(?:DEV|CAPA|OOS|OOT|CC|CR|NC|PV)[- ]?\d{3,}(?:-\d{1,4})?'
      - '(?:批号|物料(?:号|代码)|产品(?:号|代码)|货号)[:：]?\s*[A-Z0-9][A-Z0-9\-]{3,}'
      - 'LOT[- ]?[:：]?\s*[A-Z0-9]{4,}'
      - '工号[:：]?\s*[A-Za-z0-9\-]{3,}'

  # ── 工艺：只拦"带数值的关键参数"与配方本体，不拦参数名 ─────────────────
  - id: craft
    label: 工艺
    terms:
      - 工艺验证
      - 处方比例
      - 处方组成
      - 关键工艺参数
      - 合成路线
      - 结晶工艺
      - 精制工艺
      - 中间体名称
      # ←补 产品代号、中间体代号、专用工序名（如某个内部工序编号）
    patterns:
      - '(?:处方|配方|投料)[:：]\s*[^\s，。;；]{2,}'
      - '中间体[:：]?\s*[A-Za-z0-9\u4e00-\u9fa5\-]{2,}'

  # ── 工艺指标（第4项 + Z 规程清单 A 档 2/3）：指标名连带数值与单位整体脱敏 ──
  #  口径：「单独出现无害、组合起来泄密」。指标名后面跟的数值与单位一起换掉，
  #  因为「热封温度 165℃」合起来才够还原工艺；只有指标名而没有数值时，
  #  下面的 terms 兜底把指标名本身换掉。数值的正则先于 terms 命中（更长者优先）。
  - id: craft-metric
    label: 工艺
    terms:
      - 热封温度
      - 进风温度
      - 出风温度
      - 循环风温度
      - 预热温度
      - 干燥温度
      - 物料温度
      - 锅温
      - 床温
      - 喷枪温度
      - 真空度
      - 搅拌速度
      - 搅拌转速
      - 进风量
      - 排风量
      - 风量
      - 压差
      - 喷液速率
      - 喷液量
      - 主机转速
      - 包衣增重
      - 供液量
      - 片重差异
      - 片重
      - 硬度
      - 脆碎度
      - 崩解时限
      - 溶出度
      - 水分限度
      - 水分
      - 含量均匀度
      - 堆密度
      - 振实密度
      - 收膏率
      - 出膏率
      - 收率
      - 得率
      - 混合时间
      - 干燥时间
      - 制粒时间
      - 包衣时间
      - 过筛目数
      - 筛网目数
      - 粒度分布
      - 粒径
      - 增重
    patterns:
      # 指标名 + 数值（可带区间）+ 单位，整段换成一个占位符。单位按长度降序
      # 排列：`万片/小时` 必须排在 `万片` 前面，否则正则先吃掉短的那个，把
      # `/小时` 留在正文里，读起来是半截替换。
      - '(?:热封温度|进风温度|出风温度|循环风温度|预热温度|干燥温度|物料温度|锅温|床温|喷枪温度|真空度|搅拌速度|搅拌转速|进风量|排风量|风量|压差|喷液速率|喷液量|主机转速|包衣增重|供液量|片重差异|片重|硬度|脆碎度|崩解时限|溶出度|水分限度|水分|含量均匀度|堆密度|振实密度|收膏率|出膏率|收率|得率|混合时间|干燥时间|制粒时间|包衣时间|过筛目数|筛网目数|粒度分布|粒径|增重)[:：]?\s*\d+(?:\.\d+)?(?:\s*[~～〜\-–—至到]\s*\d+(?:\.\d+)?)?\s*(?:万片/小时|片/小时|mL/min|L/min|m3/h|kg/h|次/小时|次/分|转/分|r/min|分钟|小时|kPa|MPa|bar|rpm|min|kN|N/mm|μm|℃|°C|%|h|Pa|mg|kg|mm|um|g|目|N|L)?'
      # 区间写法把单位写在前面的（如 60~80℃ 之外的 5~10%），指标名在句中其他位置。
      - '(?:温度|湿度|转速|时间|压力|水分|收率|增重|粒度)[^\s，。;；:：]{0,4}[:：]?\s*\d+(?:\.\d+)?(?:\s*[~～〜\-–—至到]\s*\d+(?:\.\d+)?)\s*(?:℃|°C|%|分钟|小时|min|h|rpm|r/min|kPa|Pa|MPa|bar|目|mg|g|kg|mm)?'

  # ── 处方与投料量（Z 规程清单 A 档 1）：处方组成与投料量整体脱敏 ───────────
  #  说明书外的东西：各组分 mg/片、占比、外加比例、投料量折算。
  #  只拦带单位的量，不拦「处方」这个词本身（那是话题词，拦了正文没法读）。
  - id: recipe
    label: 处方
    terms:
      - 处方组成
      - 处方比例
      - 投料量
      - 理论投料量
      - 实际投料量
      - 外加比例
      - 内加比例
      - 总混比例
    patterns:
      # 每片/每粒/每袋的规格量：2.5mg/片、0.125g/粒。
      - '\d+(?:\.\d+)?\s*(?:mg|g|μg|ug|ml|mL)\s*/\s*(?:片|粒|袋|支|瓶|丸)'
      # 百分比占比：占比 12.5%、外加 3%。
      - '(?:占比|比例|含量)[:：]?\s*\d+(?:\.\d+)?\s*%'
      # 投料量带单位：投料量 25.5kg、投料 1200 片。
      - '(?:投料量|投料|处方量|批量)[:：]?\s*\d+(?:\.\d+)?(?:\s*[~～〜\-–—至到]\s*\d+(?:\.\d+)?)?\s*(?:kg|g|mg|万片|片|粒|袋|L|ml|mL)'

  # ── 产品代号（第5项）：每个产品固定一个字母代号，映射表可还原 ───────────

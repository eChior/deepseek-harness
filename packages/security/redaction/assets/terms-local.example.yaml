# ============================================================================
# 部门脱敏词表 —— 上传示例
#
# 这份文件用来补充公司统一词表。公司词表管的是全公司都不能外流的东西；
# 你自己部门内部才知道的叫法、代号、专项名称，写在这里。
# 上传后它和公司词表一起生效，命中就换成占位符，原文不进会话记录。
#
# 怎么用：
#   1. 把这份文件下载下来，用记事本或 VS Code 打开。
#   2. 按下面四种写法选一种（可以混用），改成你自己部门的内容。
#   3. 存成 UTF-8 编码，文件名随意。
#   4. 打开「设置 → 插件 → 脱敏状态」，在「本部门词表」里点上传。
#
# 占位符长什么样（三种，全部带方括号）：
#   [本部门-1]   普通词，按出现顺序编号
#   [专项1-3]    别名组，组号.写法号由你写在 codes 里，跨会话不变
#   [编号-2]     正则命中，按出现顺序编号
#
# 四条硬规则：
#   1. terms 一行一个词，全字匹配。中文两字词慎用：「工艺」「偏差」这种日常词
#      会把普通提问也替换掉，模型就看不懂你在问什么。宁可写长、写具体。
#   2. patterns 写正则，盖有固定形状的东西。不要写 .* 这类吃掉一整段的表达式，
#      上传时会被直接拒绝。
#   3. codes 的右边必须是「组号.写法号」这种点号形式（1.1、1.3、2.7），
#      组号相同的几个写法在还原时是同一个东西。别再写裸代号，方括号里容易和
#      编号撞车。
#   4. 缩进必须和下面一模一样：类别行两个空格，label/codes/terms/patterns 四个
#      空格，每个词条六个空格加「- 」。缩进错了上传时会提示哪一行有问题。
#
# 不用写进来的东西（写了反而吃亏）：
#   - 文件路径：本来就不脱敏，路径被打碎后文件再也打不开。
#   - 单个数字、温度、重量、时间：数值本身不脱，只有「指标名+数值+单位」这种
#     整段配方形态才换。
#   - 人名、部门名：名册只用来认人（显示工号/部门），不参与替换。
#   - 身份证号：已有内置规则，不用自己写。
#
# 词表怎么维护、公司统一词表在哪，见内网仓库
# ITPublic/dsh-redaction-terms 的 README。
# ============================================================================

version: 1

# 改成上传日期或部门名都行，只用来在设置页上区分这份文件。
revision: '2026-11-09-部门示例'

# 下面三行是「哪个部门提交的、谁提交的、要不要生效」。
# 上传时前两行由系统自动填：人名取自你登录的账号，部门拿人名去部门名单里查
# （查不到会让你在上传时自己选）。想自己声明就取消注释改掉，以你写的为准。
# enabled 想临时停用一份词表时改成 false，也可以到设置页上直接拨开关。
# department: 质量管理部
# author: 张三
# enabled: true

categories:
  # ── 第一种：内部叫法 → [本部门-1] [本部门-2] ──────────────────────────────
  # id 用小写字母和短横线，只是标识；label 才是方括号里显示的名字。
  # 下面这条是演示用的占位词，请删掉换成你自己要盖住的词。
  - id: department
    label: 本部门
    terms:
      - 演示-占位词请删掉
    patterns: []

  # ── 第二种：别名组 → [专项1-1] / [专项1-3] ────────────────────────────────
  # 同一件事的几种叫法写成同一组号，还原时都指同一个东西，但占位符编号不同，
  # 模型仍能看出「这是同一个对象的两种写法」。
  # - id: project
  #   label: 专项
  #   codes:
  #     某某专项内部代号: "1.1"
  #     某某项目简称: "1.3"
  #     某某项目旧称: "1.7"

  # ── 第三种：有固定形状的编号 → [编号-1] ───────────────────────────────────
  # 一次盖住一整类，比如 DEV-014、CAPA-2026-3 这类。
  # - id: code
  #   label: 编号
  #   patterns:
  #     - '(?:DEV|CAPA|SOP)-[A-Z0-9]{2,6}(?:-\d{2,4})?'
  #     - 'SMP-[A-Z]{2}-\d{3}(?:-\d{2})?(?:-R\d+)?'

  # ── 第四种：指标名 + 数值 + 单位 → [指标-1] ───────────────────────────────
  # 整段一起换，避免「热封温度」被换掉了数值还留在原地。
  # 单位要写在长度降序的位置：万片/小时 在 万片 前面，否则会留半截。
  # - id: metric
  #   label: 指标
  #   patterns:
  #     - '(?:热封温度|制粒温度|干燥温度)[:：]?\s*\d+(?:\.\d+)?\s*℃'
  #     - '(?:混合时间|制粒时间|干燥时间)[:：]?\s*\d+(?:\.\d+)?\s*(?:分钟|min|小时)'
  #     - '(?:投料量|处方量|批量)[:：]?\s*\d+(?:\.\d+)?\s*(?:kg|g|mg|万片/小时|万片|片)'

# ============================================================================
# 部门脱敏词表 —— 上传示例
#
# 这份文件用来补充公司统一词表。公司词表管的是全公司都不能外流的东西；
# 你自己部门内部才知道的那些叫法、代号、专项名称，写在这里。
# 上传后它和公司词表一起生效，命中就换成占位符，原文不进会话记录。
#
# 怎么用：
#   1. 把这份文件下载下来，用记事本或 VS Code 打开。
#   2. 把 categories 下面那一类的 id、label、terms 换成你自己部门的。
#      需要多类就再复制一份「- id: ...」起头的整块往下接。
#   3. 存成 UTF-8 编码，文件名随意（系统会统一存成 .yaml）。
#   4. 打开「设置 → 插件 → 脱敏状态」，在「本部门词表」里点上传。
#
# 三条硬规则（照做就不会出错）：
#   1. terms 里一行写一个词，写什么就盖住什么，是全字匹配。中文两个字以上的
#      词请慎重：「工艺」「偏差」这种日常词会把普通提问也替换掉，模型就看不懂
#      你在问什么了。宁可写长一点、写具体一点。
#   2. patterns 里写正则，用来盖住有固定形状的编号，比如
#      '(?:DEV|CAPA)-\d{3,}' 能一次盖住 DEV-014、CAPA-2026-3。
#      不要写 .* 这类会匹配一整段的表达式 —— 上传时会被直接拒绝。
#   3. 缩进必须和下面一模一样：类别行前面两个空格，label/terms/patterns 前面
#      四个空格，每个词条前面六个空格再加「- 」。缩进错了上传时会提示哪一行
#      有问题。
#
# 词表怎么维护、占位符是什么意思、公司统一词表在哪，见内网仓库
# ITPublic/dsh-redaction-terms 的 README。
# ============================================================================

version: 1

# 改成上传日期或部门名都行，只用来在设置页上区分这份文件。
revision: '2026-10-17-部门示例'

# 下面三行是「哪个部门提交的、谁提交的、要不要生效」。
# 上传时前两行由系统自动填：人名取自你登录的账号，部门拿人名去部门名单里查
# （查不到会让你在上传时自己选）。想自己声明就取消注释改掉，以你写的为准。
# enabled 想临时停用一份词表时改成 false，也可以到设置页上直接拨开关。
# department: 质量管理部
# author: 张三
# enabled: true

categories:
  # ── 第一类：本部门内部叫法 ───────────────────────────────────────────────
  # id 用小写字母和短横线，只是标识；label 才是占位符里显示的名字，
  # 也就是「本部门」这四个字 —— 命中后文字会变成 [本部门-1]、[本部门-2]……
  # 下面这条是演示用的占位词，请删掉换成你自己要盖住的词。
  - id: department
    label: 本部门
    terms:
      - 演示-占位词请删掉
    patterns: []

  # ── 第二类：专项代号（示例，默认整块注释掉了）────────────────────────────
  # 想启用就把每一行开头的 # 去掉。类别可以有多份，复制粘贴改一下就行。
  #
  # - id: project
  #   label: 专项
  #   terms:
  #     - 某某专项内部代号
  #     - 某某项目简称
  #   patterns:
  #     - '(?:专项|课题)-[A-Z]{2,4}-\d{2,4}'

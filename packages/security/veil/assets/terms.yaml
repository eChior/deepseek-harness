  # ── 元指令：拦住「让模型去找脱敏映射 / 原文」的话术 ───────────────────
  #  这类词的唯一作用就是提示模型去反查映射表或原文：用户说「把映射回写」
  #  「按脱敏映射还原」「回写原文」，模型就会去找还原规则、把占位符换回去。
  #  拦掉话术本身，模型只看到 [元指令-x]，无从定位。
  #  与硬规则 1 的例外：这里故意拦指令性话题词，因为它们指向的就是脱敏映射。
  #  不收裸「脱敏」「映射」「还原」「恢复」：它们同时是工艺 / 数据语境的高频词，
  #  收了会把正常对话一起换掉；「回写」因用户点名保留，误伤面限于「回写文件」
  #  「回写数据库」这类技术语境。
  - id: meta
    label: 元指令
    terms:
      # 回写
      - 映射回写
      - 脱敏回写
      - 回写映射
      - 回写脱敏
      - 回写原文
      - 回写占位符
      # 还原
      - 映射还原
      - 还原映射
      - 恢复映射
      - 脱敏映射
      - 脱敏还原
      - 还原脱敏
      - 还原占位符
      - 恢复占位符
      - 占位符还原
      - 原文还原
      - 原文恢复
      - 脱敏词还原
      # 查表
      - 映射表
      - 映射对照表
      - 脱敏映射表
      - 占位符映射
      # 找原文
      - 找脱敏词
      - 查脱敏词
      - 找脱敏映射
      - 找原文
      - 查原文
      - 读取原文
      - 反查原文
      # 用户点名的裸词（最长优先，组合词会先命中）
      - 回写
    patterns: []

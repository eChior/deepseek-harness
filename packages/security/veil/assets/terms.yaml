  # ── 处方与投料量（Z 规程清单 A 档 1）：处方组成与投料量整体脱敏 ───────────
  #  说明书外的东西：各组分 mg/片、占比、外加比例、投料量折算。
  #  只拦带单位的量，不拦「处方」这个词本身（那是话题词，拦了正文没法读）。
  - id: recipe
    label: 处方
    terms:
      - 处方组成
      - 处方比例
      - 投料量
      - 理论投料量
      - 实际投料量
      - 外加比例
      - 内加比例
      - 总混比例
    patterns:
      # 每片/每粒/每袋的规格量：2.5mg/片、0.125g/粒。
      - '\d+(?:\.\d+)?\s*(?:mg|g|μg|ug|ml|mL)\s*/\s*(?:片|粒|袋|支|瓶|丸)'
      # 百分比占比：占比 12.5%、外加 3%。
      - '(?:占比|比例|含量)[:：]?\s*\d+(?:\.\d+)?\s*%'
      # 投料量带单位：投料量 25.5kg、投料 1200 片。
      - '(?:投料量|投料|处方量|批量)[:：]?\s*\d+(?:\.\d+)?(?:\s*[~～〜\-–—至到]\s*\d+(?:\.\d+)?)?\s*(?:kg|g|mg|万片|片|粒|袋|L|ml|mL)'


  #  「12.5元」留给模型算总额。
  #  单价 / 金额 / 成本 / 毛利 / 售价 / 费用随本次收窄退出；带单位的那条正则、
  #  以及合同号 / 纳税人识别号 / 银行账号条目维持退出状态。

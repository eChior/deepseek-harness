name: Desktop Linux

# Packages the Electron desktop shell for Linux (AppImage + deb + tar.gz) and keeps the
# artefacts as workflow output. Linux releases carry no signing stage, so every artefact
# here is unsigned and the job needs no certificates or upload credentials.

on:
  workflow_dispatch:
  push:
    branches: [enhanced]
    paths:
      - 'apps/desktop/**'
      - 'packages/**'
      - '.github/workflows/desktop-linux.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      # The packaging and release steps live here: `package-target.ts` runs
      # `release:pack`, and a reader under scripts/ decided whether a lane could
      # read the archives that step wrote.
      - 'scripts/**'

permissions:
  contents: read

env:
  # tsdown hands every resolved workspace config to a single Promise.all, so peak memory grew with
  # this fork's package count until it overflowed every heap ceiling we could ask for (4090 MB at
  # the Node default, 8173 MB at 8 GB, 12275 MB at 12 GB). patches/tsdown@0.22.2.patch bounds that
  # batch instead; the heap ceiling stays as headroom for one batch.
  DSH_BUILD_CONCURRENCY: '8'
  NODE_OPTIONS: '--max-old-space-size=12288'
  PRIMARY_NODE_VERSION: '24'

jobs:
  package:
    name: package linux-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native runners only: cross-building either architecture on the other silently produces
          # native modules built for the wrong architecture. Both are listed because the deployment
          # target (Kylin/UOS desktop) is x64 while arm64 machines install the same release.
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          package-manager-cache: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Stamp the build version
        run: |
          set -euo pipefail
          # One product version can be built many times, and electron-updater compares versions
          # before it downloads anything, so every run needs its own ordered version. The date
          # keeps a day's builds adjacent in the feed and the commit count orders them.
          product=$(node -p "require('./apps/desktop/package.json').version")
          stamp="${product}.$(date -u +%Y%m%d).$(git rev-list --count HEAD)"
          echo "DSH_DESKTOP_BUILD_VERSION=${stamp}" >> "$GITHUB_ENV"
          echo "build version: ${stamp}"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --reporter=append-only

      - name: Install packaging dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          # libfuse2 runs the AppImage; rpm lets electron-builder build the deb payload.
          sudo apt-get install -y --no-install-recommends libfuse2 rpm build-essential

      - name: Build the WPS-backed Office converter
        run: |
          set -euo pipefail
          # Upstream publishes no LibreOffice engine for Linux, so the Office skill runs the CLI in
          # resources/wps against the WPS installation instead. Only the compiled binary ships.
          #
          # The target desktop is Kylin V10 with glibc 2.31, so the shim is compiled inside a 20.04
          # image rather than on the runner: linking against the runner's newer libc records
          # GLIBC_2.34 and GLIBC_2.38 symbol versions, and the binary then refuses to start on the
          # target with "version `GLIBC_2.38' not found".
          # The container runs as root because apt refuses any other account, and the binary is
          # handed back to the runner account before the job continues.
          docker run --rm -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" -v "$PWD:/work" -w /work ubuntu:20.04 bash -c '
            set -euo pipefail
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y -qq g++
            g++ -O2 -o apps/desktop/resources/wps/wps2pdf apps/desktop/resources/wps/wps2pdf.cpp -ldl
            chown "$HOST_UID:$HOST_GID" apps/desktop/resources/wps/wps2pdf
            ldd apps/desktop/resources/wps/wps2pdf | head -5'
          ls -l apps/desktop/resources/wps/

      - name: Write the staff roster key
        env:
          DSH_ROSTER_KEY: ${{ secrets.DSH_ROSTER_KEY }}
        # The roster travels as ciphertext inside the repository; the key that opens it is a
        # secret, so the lane writes it beside the ciphertext before packaging. Without the secret
        # packaging still succeeds: the client then reports that no directory is in force, which
        # costs the department attribution and the colleague terms but breaks nothing.
        run: |
          set -euo pipefail
          if [ -z "${DSH_ROSTER_KEY:-}" ]; then
            echo 'No DSH_ROSTER_KEY secret is set; packaging without a staff roster.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          key_path=packages/security/redaction/assets/roster.key
          printf '%s\n' "$DSH_ROSTER_KEY" | tr -d '[:space:]' > "$key_path"
          printf '\n' >> "$key_path"
          echo "Wrote the staff roster key to $key_path" >> "$GITHUB_STEP_SUMMARY"

      - name: Write apps/desktop/.env.linux
        run: |
          set -euo pipefail
          cat > apps/desktop/.env.linux <<'EOF'
          DSH_DESKTOP_APP_ID=com.deepseek.harness
          DSH_DESKTOP_AUTO_UPDATE_ENV=test
          DOWNLOAD_TEST_ORIGIN=https://download.local.invalid
          DOWNLOAD_TEST_RELEASE_ID=0123456789abcdef0123456789abcdef
          DSH_DESKTOP_LINUX_PACK_CONCURRENCY=4
          DSH_DESKTOP_MANDATORY_UPDATE_TEST_ORIGIN=https://update.local.invalid
          DSH_DESKTOP_MANDATORY_UPDATE_PROD_ORIGIN=https://update.local.invalid
          DSH_DESKTOP_MANDATORY_UPDATE_CONFIG={"allowedAuthOrigins":["https://login.local.invalid"]}
          EOF
          sed -i 's/^          //' apps/desktop/.env.linux
          cat apps/desktop/.env.linux

      - name: Package linux-${{ matrix.arch }}
        # The stamp has to arrive as an argument. `package-target.ts` derives the version it
        # publishes from `--build-version` alone and then overwrites the environment variable with
        # that result, so a stamp living only in `$GITHUB_ENV` never reaches electron-builder: the
        # feed would advertise the product version, and electron-updater would report an already
        # installed build as the newest one.
        run: pnpm --dir apps/desktop run package:linux:${{ matrix.arch }} -- --build-version "$DSH_DESKTOP_BUILD_VERSION"

      - name: Upload artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-harness-linux-${{ matrix.arch }}
          # Ship the deb plus the channel metadata. AppImage and tar.gz carry the same
          # application a second and third time; add them back when the self-hosted update
          # origin needs the AppImage carrier. electron-updater reads the channel file from
          # the release directory, so it has to travel with the package.
          path: |
            apps/desktop/.desktop-build/targets/linux-${{ matrix.arch }}/artifacts/*.deb
            apps/desktop/.desktop-build/targets/linux-${{ matrix.arch }}/artifacts/*.yml
          if-no-files-found: warn
          retention-days: 14

      - name: Publish linux-${{ matrix.arch }} to Gitea
        if: always() && env.GITEA_TOKEN != ''
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          set -euo pipefail
          origin="${GITEA_ORIGIN:-http://10.151.5.175:3000}"
          repo="${GITEA_REPOSITORY:-ITPublic/deepseek-harness}"
          version="$(node -p "require('./apps/desktop/package.json').version")"
          tag="v${version}-hrzszy"
          artifacts="apps/desktop/.desktop-build/targets/linux-${{ matrix.arch }}/artifacts"
          auth="Authorization: token ${GITEA_TOKEN}"

          # Reuse the release when this version was published before, so a rerun adds assets
          # instead of failing on the tag that already exists.
          release_id="$(curl -sS "${origin}/api/v1/repos/${repo}/releases?limit=50" -H "${auth}" \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const tag=process.argv[1];const found=(JSON.parse(s)||[]).find(r=>r.tag_name===tag);process.stdout.write(found?String(found.id):'')})" "${tag}")"
          if [ -z "${release_id}" ]; then
            release_id="$(curl -sS -X POST "${origin}/api/v1/repos/${repo}/releases" -H "${auth}" \
              -H 'Content-Type: application/json' \
              -d "{\"tag_name\":\"${tag}\",\"target_commitish\":\"${GITHUB_REF_NAME}\",\"name\":\"DeepSeek Harness 增强版 ${version}\",\"draft\":false,\"prerelease\":false}" \
              | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{process.stdout.write(String(JSON.parse(s).id))})")"
          fi

          for file in "${artifacts}"/*.deb "${artifacts}"/*.yml; do
            [ -e "${file}" ] || continue
            curl -sS -X DELETE "${origin}/api/v1/repos/${repo}/releases/${release_id}/assets?name=$(basename "${file}")" -H "${auth}" > /dev/null || true
            curl -sS -X POST "${origin}/api/v1/repos/${repo}/releases/${release_id}/assets?name=$(basename "${file}")" \
              -H "${auth}" -H 'Content-Type: application/octet-stream' --data-binary "@${file}" > /dev/null
            echo "published $(basename "${file}") to ${tag}"
          done

      - name: Summarize artefacts
        if: always()
        run: |
          {
            echo "### linux-${{ matrix.arch }}"
            ls -lh "apps/desktop/.desktop-build/targets/linux-${{ matrix.arch }}/artifacts" || true
          } >> "$GITHUB_STEP_SUMMARY"

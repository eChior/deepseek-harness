name: Desktop Windows

# Packages this distribution's unsigned Windows x64 NSIS installer on GitHub's Windows runner.
#
# Upstream ships no Desktop packaging lane: a signed release needs an EV token, SignTool, and a
# PIN, so the only path a hosted runner can complete is the unsigned one described in
# apps/desktop/README.md. `package:win:x64:unsigned` writes its installer to
# apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/ and needs the same Windows x64
# host, Python, and Visual C++ build tools that the signed lane does, minus the signing hardware.

on:
  workflow_dispatch:
  # The push trigger stays off while this fork ships Linux only, so a desktop change cannot fire a
  # Windows runner. Restore the block below to re-enable it.
  # push:
  #   branches:
  #     - enhanced
  #   paths:
  #     - 'apps/desktop/**'
  #     - '.github/workflows/desktop-windows.yml'
  #     - 'package.json'
  #     - 'pnpm-lock.yaml'

permissions:
  contents: read

env:
  # CI runs must never report to the production telemetry endpoint baked into apps/cli/cordis.yml.
  DSH_TELEMETRY_DISABLED: '1'
  PRIMARY_NODE_VERSION: '24'

jobs:
  package:
    name: package win-x64 unsigned
    runs-on: windows-latest
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Packaging records the commit and the dirty flag in the artifact manifest.
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          package-manager-cache: false

      - name: Set up Python for native modules
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --reporter=append-only

      - name: Report install diagnostics
        if: failure()
        shell: pwsh
        run: |
          # A failed install must leave its reason on the run summary: the failure log is
          # only readable to a signed-in actor, and the job dies before any artifact exists.
          "pnpm: $(pnpm --version)" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          "node: $(node -v)" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          $logs = Join-Path $env:LOCALAPPDATA 'pnpm-cache\_logs'
          if (Test-Path $logs) {
            Get-ChildItem $logs | Sort-Object LastWriteTime -Descending | Select-Object -First 2 | ForEach-Object {
              "### $($_.Name)" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
              Get-Content $_.FullName -Tail 300 | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
            }
          }

      - name: Write apps/desktop/.env.windows
        shell: pwsh
        run: |
          # Git ignores this file, so the lane writes the release settings the packaging
          # preflight reads: an application id, a mandatory-update policy for the default
          # `test` deployment, and the signature-cache concurrency. Unsigned packaging
          # resolves no signing certificate and no update credentials.
          $path = Join-Path $PWD 'apps/desktop/.env.windows'
          @(
            'DSH_DESKTOP_APP_ID=com.deepseek.harness'
            'DSH_DESKTOP_AUTO_UPDATE_ENV=test'
            'DSH_DESKTOP_MANDATORY_UPDATE_TEST_ORIGIN=https://update.local.invalid'
            'DSH_DESKTOP_MANDATORY_UPDATE_CONFIG={"allowedAuthOrigins":["https://login.local.invalid"]}'
            'DSH_DESKTOP_WINDOWS_SIGNATURE_CACHE_CONCURRENCY=4'
          ) | Set-Content -Path $path -Encoding utf8
          Get-Content $path

      - name: Package Windows x64
        run: pnpm run package:desktop:win:x64:unsigned

      - name: Upload installer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-x64-unsigned
          # Ship the installer and its update block map only: the unpacked application directory
          # doubles the artifact without adding anything the installer does not already carry.
          path: |
            apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/*.exe
            apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/*.exe.blockmap
          if-no-files-found: warn
          retention-days: 14

      - name: Upload packaging logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-x64-packaging-runs
          path: apps/desktop/.desktop-build/packaging-runs/**
          if-no-files-found: ignore
          retention-days: 7

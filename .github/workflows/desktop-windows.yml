name: Desktop Windows

# Packages this distribution's unsigned Windows x64 NSIS installer on GitHub's Windows runner.
#
# Upstream ships no Desktop packaging lane: a signed release needs an EV token, SignTool, and a
# PIN, so the only path a hosted runner can complete is the unsigned one described in
# apps/desktop/README.md. `package:win:x64:unsigned` writes its installer to
# apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/ and needs the same Windows x64
# host, Python, and Visual C++ build tools that the signed lane does, minus the signing hardware.

on:
  workflow_dispatch:
  # This fork ships both installers, so a desktop change rebuilds both. The paths stay narrow
  # (shell, packages, and lockfile) so a documentation-only edit cannot burn a Windows runner.
  push:
    branches:
      - enhanced
    paths:
      - 'apps/desktop/**'
      - 'packages/**'
      - '.github/workflows/desktop-windows.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'

permissions:
  contents: read

env:
  # CI runs must never report to the production telemetry endpoint baked into apps/cli/cordis.yml.
  DSH_TELEMETRY_DISABLED: '1'
  # tsdown hands every resolved workspace config to a single Promise.all, so peak memory grew with
  # this fork's package count until it overflowed every heap ceiling we could ask for (4090 MB at
  # the Node default, 8173 MB at 8 GB, 12275 MB at 12 GB). patches/tsdown@0.22.2.patch bounds that
  # batch instead; the heap ceiling stays as headroom for one batch.
  DSH_BUILD_CONCURRENCY: '8'
  NODE_OPTIONS: '--max-old-space-size=12288'
  PRIMARY_NODE_VERSION: '24'

jobs:
  package:
    name: package win-x64 unsigned
    runs-on: windows-latest
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Packaging records the commit and the dirty flag in the artifact manifest.
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          package-manager-cache: false

      - name: Set up Python for native modules
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --reporter=append-only

      - name: Report install diagnostics
        if: failure()
        shell: pwsh
        run: |
          # A failed install must leave its reason on the run summary: the failure log is
          # only readable to a signed-in actor, and the job dies before any artifact exists.
          "pnpm: $(pnpm --version)" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          "node: $(node -v)" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          $logs = Join-Path $env:LOCALAPPDATA 'pnpm-cache\_logs'
          if (Test-Path $logs) {
            Get-ChildItem $logs | Sort-Object LastWriteTime -Descending | Select-Object -First 2 | ForEach-Object {
              "### $($_.Name)" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
              Get-Content $_.FullName -Tail 300 | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
            }
          }

      - name: Write apps/desktop/.env.windows
        shell: pwsh
        run: |
          # Git ignores this file, so the lane writes the release settings the packaging
          # preflight reads: an application id, a mandatory-update policy for the default
          # `test` deployment, and the signature-cache concurrency. Unsigned packaging
          # resolves no signing certificate and no update credentials.
          $path = Join-Path $PWD 'apps/desktop/.env.windows'
          @(
            'DSH_DESKTOP_APP_ID=com.deepseek.harness'
            'DSH_DESKTOP_AUTO_UPDATE_ENV=test'
            'DSH_DESKTOP_MANDATORY_UPDATE_TEST_ORIGIN=https://update.local.invalid'
            'DSH_DESKTOP_MANDATORY_UPDATE_CONFIG={"allowedAuthOrigins":["https://login.local.invalid"]}'
            'DSH_DESKTOP_WINDOWS_SIGNATURE_CACHE_CONCURRENCY=4'
          ) | Set-Content -Path $path -Encoding utf8
          Get-Content $path

      - name: Package Windows x64
        run: pnpm run package:desktop:win:x64:unsigned

      - name: Upload installer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-x64-unsigned
          # Ship the installer, its update block map, and the channel metadata electron-updater
          # reads out of the release directory: the unpacked application directory doubles the
          # artifact without adding anything the installer does not already carry.
          path: |
            apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/*.exe
            apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/*.exe.blockmap
            apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/*.yml
          if-no-files-found: warn
          retention-days: 14

      - name: Publish win-x64 to Gitea
        if: always() && env.GITEA_TOKEN != ''
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $origin = if ($env:GITEA_ORIGIN) { $env:GITEA_ORIGIN } else { 'http://10.151.5.175:3000' }
          $repo = if ($env:GITEA_REPOSITORY) { $env:GITEA_REPOSITORY } else { 'ITPublic/deepseek-harness' }
          $version = (Get-Content 'apps/desktop/package.json' -Raw | ConvertFrom-Json).version
          $tag = "v$version-hrzszy"
          $artifacts = 'apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts'
          $headers = @{ Authorization = "token $env:GITEA_TOKEN" }

          # Reuse the release when this version was published before, so a rerun adds assets
          # instead of failing on the tag that already exists.
          $releases = Invoke-RestMethod -Uri "$origin/api/v1/repos/$repo/releases?limit=50" -Headers $headers
          $existing = $releases | Where-Object { $_.tag_name -eq $tag } | Select-Object -First 1
          if ($existing) {
            $releaseId = $existing.id
          } else {
            $body = @{
              tag_name = $tag
              target_commitish = $env:GITHUB_REF_NAME
              name = "DeepSeek Harness 增强版 $version"
              draft = $false
              prerelease = $false
            } | ConvertTo-Json
            $releaseId = (Invoke-RestMethod -Method Post -Uri "$origin/api/v1/repos/$repo/releases" `
              -Headers $headers -ContentType 'application/json' -Body $body).id
          }

          $files = Get-ChildItem -Path $artifacts -File | Where-Object { $_.Extension -in @('.exe', '.yml') }
          foreach ($file in $files) {
            $assetName = $file.Name
            # Replacing means deleting first: Gitea rejects a second asset with the same name.
            try {
              Invoke-RestMethod -Method Delete -Uri "$origin/api/v1/repos/$repo/releases/$releaseId/assets?name=$assetName" `
                -Headers $headers | Out-Null
            } catch {
              Write-Output "no existing asset $assetName"
            }
            Invoke-RestMethod -Method Post -Uri "$origin/api/v1/repos/$repo/releases/$releaseId/assets?name=$assetName" `
              -Headers $headers -ContentType 'application/octet-stream' -InFile $file.FullName | Out-Null
            Write-Output "published $assetName to $tag"
          }

      - name: Upload packaging logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-x64-packaging-runs
          path: apps/desktop/.desktop-build/packaging-runs/**
          if-no-files-found: ignore
          retention-days: 7
